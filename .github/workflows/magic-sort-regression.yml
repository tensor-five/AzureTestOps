name: Magic Sort regression

on:
  pull_request:
    paths:
      - src/features/relations-view/**
      - src/features/filters/**
      - src/shared/user-preferences/**
      - src/app/bootstrap/local-ui-*.css
      - tests/e2e/magic-sort-filter-stability*
      - .github/workflows/magic-sort-regression.yml
  push:
    branches: [main, Development]
    paths:
      - src/features/relations-view/**
      - src/features/filters/**
      - src/shared/user-preferences/**
      - src/app/bootstrap/local-ui-*.css
      - tests/e2e/magic-sort-filter-stability*
      - .github/workflows/magic-sort-regression.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run quality:gate
      - run: npx playwright install chromium
      - run: npm run test:e2e -- tests/e2e/magic-sort-filter-stability.spec.ts
