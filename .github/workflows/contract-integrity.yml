name: Contract integrity

on:
  pull_request:
    paths:
      - docs/contracts/**
      - scripts/check-contract-integrity.mjs
      - scripts/check-frozen-tests.mjs
      - src/features/relations-view/magic-sort.contract.spec.tsx
      - src/features/relations-view/magic-sort-header-placement.contract.spec.tsx
      - src/features/relations-view/magic-sort-visible-positions.contract.spec.tsx
      - src/features/relations-view/magic-sort-spacers.contract.spec.tsx
      - .github/workflows/contract-integrity.yml
  push:
    branches:
      - main
      - Development
    paths:
      - docs/contracts/**
      - scripts/check-contract-integrity.mjs
      - scripts/check-frozen-tests.mjs
      - src/features/relations-view/magic-sort-spacers.contract.spec.tsx
      - src/features/relations-view/magic-sort.contract.spec.tsx
      - .github/workflows/contract-integrity.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/check-contract-integrity.mjs
          node scripts/check-frozen-tests.mjs
          npm ci
          npm test -- src/features/relations-view/magic-sort.contract.spec.tsx src/features/relations-view/magic-sort-header-placement.contract.spec.tsx src/features/relations-view/magic-sort-visible-positions.contract.spec.tsx src/features/relations-view/magic-sort-spacers.contract.spec.tsx
