name: Contract integrity

on:
  pull_request:
    paths:
      - docs/contracts/**
      - scripts/check-contract-integrity.mjs
      - scripts/check-frozen-tests.mjs
      - src/features/relations-view/magic-sort.contract.spec.tsx
      - src/features/relations-view/magic-sort-header-placement.contract.spec.tsx
      - src/features/relations-view/magic-sort-visible-positions.contract.spec.tsx
      - src/features/relations-view/magic-sort-spacers.contract.spec.tsx
      - src/features/relations-view/magic-sort-measured-geometry.contract.spec.ts
      - src/features/relations-view/magic-sort-compact-unlinked-bugs.contract.spec.ts
      - src/features/relations-view/magic-sort-feedback.contract.spec.tsx
      - src/features/relations-view/magic-sort-immediate-feedback.contract.spec.tsx
      - src/features/relations-view/bug-test-case-status-conflicts.contract.spec.tsx
      - src/features/relations-view/relation-card-focus.contract.spec.tsx
      - src/features/relations-view/relation-card-focus-conflict-color.contract.spec.tsx
      - src/features/relations-view/refresh-header-placement.contract.spec.tsx
      - src/features/relations-view/add-spacer-manual-bug-placement.contract.spec.tsx
      - tests/e2e/bug-test-case-status-conflicts.contract.spec.ts
      - tests/e2e/bug-test-case-status-conflicts-harness.tsx
      - .github/workflows/contract-integrity.yml
  push:
    branches:
      - main
      - Development
    paths:
      - docs/contracts/**
      - scripts/check-contract-integrity.mjs
      - scripts/check-frozen-tests.mjs
      - src/features/relations-view/magic-sort-spacers.contract.spec.tsx
      - src/features/relations-view/magic-sort.contract.spec.tsx
      - src/features/relations-view/magic-sort-measured-geometry.contract.spec.ts
      - src/features/relations-view/magic-sort-compact-unlinked-bugs.contract.spec.ts
      - src/features/relations-view/magic-sort-feedback.contract.spec.tsx
      - src/features/relations-view/magic-sort-immediate-feedback.contract.spec.tsx
      - src/features/relations-view/bug-test-case-status-conflicts.contract.spec.tsx
      - src/features/relations-view/relation-card-focus.contract.spec.tsx
      - src/features/relations-view/relation-card-focus-conflict-color.contract.spec.tsx
      - src/features/relations-view/refresh-header-placement.contract.spec.tsx
      - src/features/relations-view/add-spacer-manual-bug-placement.contract.spec.tsx
      - tests/e2e/bug-test-case-status-conflicts.contract.spec.ts
      - tests/e2e/bug-test-case-status-conflicts-harness.tsx
      - .github/workflows/contract-integrity.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/check-contract-integrity.mjs
          node scripts/check-frozen-tests.mjs
          npm ci
          npm test -- src/features/relations-view/magic-sort.contract.spec.tsx src/features/relations-view/magic-sort-header-placement.contract.spec.tsx src/features/relations-view/magic-sort-visible-positions.contract.spec.tsx src/features/relations-view/magic-sort-spacers.contract.spec.tsx src/features/relations-view/magic-sort-measured-geometry.contract.spec.ts src/features/relations-view/magic-sort-compact-unlinked-bugs.contract.spec.ts src/features/relations-view/magic-sort-feedback.contract.spec.tsx src/features/relations-view/magic-sort-immediate-feedback.contract.spec.tsx src/features/relations-view/bug-test-case-status-conflicts.contract.spec.tsx src/features/relations-view/relation-card-focus.contract.spec.tsx src/features/relations-view/relation-card-focus-conflict-color.contract.spec.tsx src/features/relations-view/refresh-header-placement.contract.spec.tsx src/features/relations-view/add-spacer-manual-bug-placement.contract.spec.tsx
          npx playwright install chromium
          npm run test:e2e -- tests/e2e/bug-test-case-status-conflicts.contract.spec.ts
