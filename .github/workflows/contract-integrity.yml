name: Contract integrity

on:
  pull_request:
    paths:
      - docs/contracts/**
      - scripts/check-contract-integrity.mjs
      - .github/workflows/contract-integrity.yml
  push:
    branches:
      - main
      - Development
    paths:
      - docs/contracts/**
      - scripts/check-contract-integrity.mjs
      - .github/workflows/contract-integrity.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-contract-integrity.mjs
